<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064b37">
  <title>MedUp | Workspace de questões médicas</title>
  <meta name="description" content="Importe, organize, estude e compartilhe questões médicas com processamento local.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="institutional-ribbon">MedUp Academic Performance · ambiente local e privado</div>
  <div class="app-shell" id="app-shell" aria-busy="true">
    <aside class="app-sidebar" aria-label="MedUp">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-copy"><strong>MedUp</strong><span>Questões médicas</span></span>
      </div>
      <nav class="primary-navigation" aria-label="Navegação principal">
        <button class="nav-item" type="button" data-tab="biblioteca" id="tab-biblioteca"><span class="nav-index" aria-hidden="true">01</span><span>Biblioteca</span></button>
        <button class="nav-item active" type="button" data-tab="import" id="tab-import"><span class="nav-index" aria-hidden="true">02</span><span>Importar</span></button>
        <button class="nav-item" type="button" data-tab="simulado" id="tab-simulado"><span class="nav-index" aria-hidden="true">03</span><span>Simulado</span></button>
        <button class="nav-item" type="button" data-tab="editor" id="tab-editor"><span class="nav-index" aria-hidden="true">04</span><span>Editar Questões</span></button>
        <button class="nav-item" type="button" data-tab="exportar" id="tab-exportar"><span class="nav-index" aria-hidden="true">05</span><span>Exportar</span></button>
      </nav>
      <div class="sidebar-art" aria-hidden="true"></div>
      <p class="privacy-note">“Disciplina hoje, para se tornar o médico que você quer ser amanhã.”</p>
    </aside>
    <div class="workspace-shell">
      <header class="workspace-header">
        <div>
          <p class="workspace-eyebrow" id="route-eyebrow">Entrada de conteúdo</p>
          <h1 id="route-title">Importar questões</h1>
        </div>
        <div class="workspace-status" aria-label="Status do ambiente"><span class="status-dot" aria-hidden="true"></span>Processamento local</div>
      </header>
      <div id="app-notice" class="app-notice" role="status" aria-live="polite" hidden></div>
      <main class="workspace-main" id="main-content" tabindex="-1">
        <section id="biblioteca-tab" class="tab-content" aria-labelledby="route-title" hidden></section>
        <section id="import-tab" class="tab-content active" aria-labelledby="route-title"></section>
        <section id="simulado-tab" class="tab-content" aria-labelledby="route-title" hidden></section>
        <section id="editor-tab" class="tab-content" aria-labelledby="route-title" hidden></section>
        <section id="exportar-tab" class="tab-content" aria-labelledby="route-title" hidden></section>
      </main>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
